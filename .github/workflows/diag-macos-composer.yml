name: diag macOS composer
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      - name: Build macOS demo
        run: mbx build --locked --features demo
      - name: Shots
        timeout-minutes: 8
        env:
          ZAPFAST_DIAG_COMPOSER: "1"
        run: |
          set -x
          shot() {
            name=$1; shift
            "$@" target/debug/zapfast --demo --demo-size 1100x700 --demo-shot "$RUNNER_TEMP/zapfast-$name.png" --demo-shot-delay 6000 2> "$RUNNER_TEMP/zapfast-$name.log" || true
            grep DIAG "$RUNNER_TEMP/zapfast-$name.log" | tail -20 || true
          }
          shot empty env
          shot short env ZAPFAST_DIAG_DRAFT="Hoi, hoe gaat het?"
          shot three env ZAPFAST_DIAG_DRAFT="Eerste regel\nTweede regel met wat meer tekst\nDerde regel 😂🤣"
          shot long env ZAPFAST_DIAG_DRAFT="Dit is een lang bericht dat over meerdere regels loopt zodat we kunnen zien hoe de verzendknop zich gedraagt wanneer het typveld groeit, met nog wat extra woorden erachter om het geheel minstens drie of vier regels hoog te maken in het venster 🤣🤣"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-composer-diag
          path: ${{ runner.temp }}/zapfast-*
